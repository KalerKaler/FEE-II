<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        
    </style>
</head>
<body>
    
    <div id="todo"></div>

    
    <script>
        (function (){
            let todos = JSON.parse(localStorage.getItem('todos')) ?? [];
            
            const todocontainer=document.getElementById("todo");
            const todoinput=document.createElement("input");
            todoinput.type="text";
            todoinput.placeholder="Enter task..."
            const addbtn=document.createElement("button");
            addbtn.textContent="ADD";
            const todolist=document.createElement("div");
            todolist.style.border="2px solid black"
            todocontainer.append(todoinput,addbtn,todolist);
            
            for (let itm of todos){
                rendertask(itm);
            }
        
            function rendertask(task){
                const todoitem=document.createElement("div");
                todoitem.style.border="2px solid red";
                todoitem.style.margin="10px";

                const p=document.createElement("p");
                p.textContent=task;
                const deletebtn=document.createElement("button");
                deletebtn.textContent="Delete";
                const editbtn=document.createElement("button");
                editbtn.textContent="Edit";
                const completebtn = document.createElement("button");
                completebtn.textContent = "Complete";

                completebtn.addEventListener('click', event => {
                    todoitem.style.background = "Green";
                })
                
                editbtn.addEventListener("click",function(){
                    const editinput=document.createElement("input");
                    editinput.value=task;
                    const savebtn=document.createElement("button");
                    savebtn.textContent="Save";
                    todoitem.prepend(editinput,savebtn);
                    editinput.focus();
                    savebtn.addEventListener("click",function(){
                        const updatedtask=editinput.value;
                        if(!updatedtask){
                            return;
                        }
                        p.textContent=updatedtask;
                        const index=todos.indexOf(task);
                        todos[index]=updatedtask;
                        addToLocalStorage();
                        editinput.remove();
                        savebtn.remove();
                        console.log(todos);
                        todoitem.style.background = 'none';
                    })
                })

                deletebtn.addEventListener("click",function(){
                    const index=todos.indexOf(task);
                    todos.splice(index,1);
                    todoitem.remove();
                    addToLocalStorage();
                })
                todoitem.append(p,deletebtn,editbtn, completebtn);
                todolist.prepend(todoitem);


                
            }
            function addtodo(){
                const task=todoinput.value;
                console.log(task);
                if(!task){
                    return;
                }
                todos.unshift(task);
                addToLocalStorage();
            
                rendertask(task);
                todoinput.value="";
                todoinput.focus();


            }
            addbtn.addEventListener("click",addtodo);
            todoinput.addEventListener("keydown",function(e){
                // console.log(e);
                if(e.key==="Enter"){
                    addtodo();
                }
            })

            function addToLocalStorage(){
                localStorage.clear();
                localStorage.setItem('todos', JSON.stringify(todos));
            }

        })()
    </script>
</body>
</html>
